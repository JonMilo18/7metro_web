name: Publish 7metro PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check i18n.js
          node --check locales/es.js
          node --check sw.js
          node --check insights-data.js
          node --check insights.js
          node --check report-pdf.js
          node --check portal.js
          node --check portal-events.js
          node --check portal-calendar.js
          node --check push.js
          node --check weekly-training.js
          node --check inbox.js

      - name: Set up Node.js for backend tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Verify application data and backend actions
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html app.js i18n.js sw.js insights-data.js insights.js report-pdf.js insights.css portal.js portal-events.js portal-calendar.js push.js weekly-training.js inbox.js portal.css manifest.json manifest.webmanifest _site/
          cp -R icons irudiak locales vendor _site/

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload public files
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
